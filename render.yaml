# Render.com deployment configuration
# Deploy both client (static site) and server (web service) from one repo

services:
  # ── Backend API (Express.js) ───────────────────────────────────────────
  - type: web
    name: muhsinah-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        sync: false        # fill in Render dashboard
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: mtalks_db
      - key: DB_PORT
        value: 3306
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://www.muhsinahacademy.com
      - key: COOKIE_DOMAIN
        value: .muhsinahacademy.com
    healthCheckPath: /api/health

  # ── Frontend (Vue 3 Vite SPA) ──────────────────────────────────────────
  - type: web
    name: muhsinah-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://muhsinah-api.onrender.com/api
